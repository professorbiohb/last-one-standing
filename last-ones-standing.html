<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Last Ones Standing</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#dff3ff;--ink:#12202e;--card:#fff;--accent:#ff7b00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14202c;--ink:#f4f8fb;--card:#223446;--accent:#ffb703}}
:root[data-theme="dark"]{--bg:#14202c;--ink:#f4f8fb;--card:#223446;--accent:#ffb703}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Lilita One','Trebuchet MS',Verdana,sans-serif}
canvas{position:fixed;inset:0;display:block;cursor:none}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:color-mix(in srgb,var(--bg) 88%,transparent);text-align:center;padding:20px}
#ov h1{font-size:clamp(34px,7vw,64px);margin:0;font-weight:400;letter-spacing:.5px}
#ov p{margin:0;max-width:520px;line-height:1.5;opacity:.85;font-family:'Trebuchet MS',Verdana,sans-serif;font-size:15px}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.ch{background:var(--card);color:var(--ink);border:3px solid transparent;border-radius:16px;padding:16px 18px;width:150px;font:inherit;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.ch:hover,.ch:focus-visible{border-color:var(--accent);outline:none;transform:translateY(-2px)}
.ch i{display:block;width:46px;height:46px;border-radius:50%;margin:0 auto 8px;border:4px solid var(--ink)}
.ch b{display:block;font-weight:400;font-size:22px}
.ch span{font-family:'Trebuchet MS',Verdana,sans-serif;font-size:13px;opacity:.8}
#ov{background:radial-gradient(circle at 15% 20%,#4a2fa0,transparent 55%),radial-gradient(circle at 85% 80%,#0a7a96,transparent 55%),#15112e;color:#fff;overflow:hidden;display:block;padding:0}
#ov:not(.hide){animation:fade .4s}@keyframes fade{from{opacity:0}}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:18px;padding:20px;opacity:0;pointer-events:none;transform:translateY(26px) scale(.97);transition:opacity .35s,transform .45s cubic-bezier(.2,.9,.3,1.2);overflow:auto}
.scr.on{opacity:1;pointer-events:auto;transform:none}
#ov h1{background:linear-gradient(90deg,#ffd23f,#ff7b00,#ff4d6d,#ffd23f);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite,bob 3s ease-in-out infinite;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
@keyframes shine{to{background-position:-300% 0}}@keyframes bob{50%{transform:translateY(-8px)}}
#ov h2{margin:0;font-size:clamp(26px,5vw,40px);font-weight:400}#ov h3{margin:0;font-weight:400;font-size:18px;opacity:.8}
.big{font:inherit;font-size:28px;padding:14px 56px;border:0;border-radius:18px;background:#ffd23f;color:#2a1a05;cursor:pointer;box-shadow:0 7px 0 #c58a2b;transition:transform .15s,box-shadow .15s;animation:pulse 1.6s ease-in-out infinite}
.big:hover{transform:translateY(-3px) scale(1.05)}.big:active{transform:translateY(5px);box-shadow:0 2px 0 #c58a2b}@keyframes pulse{50%{box-shadow:0 7px 0 #c58a2b,0 0 30px rgba(255,210,63,.6)}}
.card{position:relative;font:inherit;color:#fff;background:rgba(255,255,255,.09);border:3px solid rgba(255,255,255,.18);border-radius:22px;padding:20px 18px;width:210px;cursor:pointer;backdrop-filter:blur(6px);box-shadow:none;transition:transform .2s,border-color .2s,background .2s}
.scr.on .card{animation:pop .55s cubic-bezier(.2,1.3,.4,1) both}.card:nth-child(2){animation-delay:.08s!important}.card:nth-child(3){animation-delay:.16s!important}.card:nth-child(4){animation-delay:.24s!important}.card:nth-child(5){animation-delay:.32s!important}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.85)}}
.card:hover{transform:translateY(-8px) rotate(-1.5deg);border-color:#ffd23f;background:rgba(255,255,255,.15)}
.card.on{border-color:#ffd23f;background:rgba(255,210,63,.18);box-shadow:0 0 28px rgba(255,210,63,.35)}
.card.on::after{content:'\2713';position:absolute;top:-10px;right:-10px;width:28px;height:28px;border-radius:50%;background:#ffd23f;color:#2a1a05;line-height:28px;font-size:16px}
.card b{display:block;font-weight:400;font-size:24px;margin:6px 0 4px}.card span{display:block;font-family:'Trebuchet MS',Verdana,sans-serif;font-size:13px;line-height:1.4;opacity:.85}
.card .ic{font-size:44px;opacity:1;animation:bob 2.4s ease-in-out infinite}.card.sm{width:150px;padding:14px 10px}
.pips{display:flex;gap:4px;justify-content:center;margin-top:10px}.pips u{width:16px;height:7px;border-radius:4px;background:rgba(255,255,255,.2)}.pips u.f{background:#ffd23f}
.ch i.blob{display:block;position:relative;width:62px;height:66px;border-radius:26px;background:var(--c);border:4px solid #1d1b2e;margin:6px auto 12px;animation:hop 1.1s ease-in-out infinite}
.ch:nth-child(2) i.blob{animation-delay:.2s}.ch:nth-child(3) i.blob{animation-delay:.4s}
.blob::before,.blob::after{content:'';position:absolute;top:18px;width:14px;height:18px;border-radius:50%;border:2px solid #1d1b2e;background:radial-gradient(circle at 65% 55%,#1d1b2e 0 4px,#fff 5px)}.blob::before{left:9px}.blob::after{right:9px}@keyframes hop{50%{transform:translateY(-12px)}}
.tips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px}.tips span,.pill{background:rgba(255,255,255,.1);border-radius:999px;padding:6px 14px;font-size:14px}.pill.off{opacity:.5}
.back{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;font:inherit;font-size:18px;color:#fff;background:rgba(255,255,255,.12);border:0;border-radius:999px;padding:8px 18px;cursor:pointer}.back:hover{background:rgba(255,255,255,.25)}
.skin{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.namebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}.namebox input{font:inherit;font-size:20px;text-align:center;width:210px;padding:8px 14px;border-radius:999px;border:3px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;outline:none}.namebox input:focus{border-color:#ffd23f}.namebox input::placeholder{color:rgba(255,255,255,.5)}
.rnd{font:inherit;font-size:16px;color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:999px;padding:9px 16px;cursor:pointer}.rnd:hover{background:rgba(255,255,255,.28)}
.rig{position:relative;width:700px;max-width:100%;height:272px}.rig canvas{position:absolute;left:50%;top:0;width:220px;height:260px;transform:translateX(-50%);cursor:default;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35))}
.pc{position:absolute;width:210px;display:flex;align-items:center;justify-content:space-between;gap:6px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);border-radius:14px;padding:6px 8px;backdrop-filter:blur(6px);animation:pop .5s cubic-bezier(.2,1.3,.4,1) both}
.pc.l{left:0}.pc.r{right:0}.pc.l::after,.pc.r::before{content:'';position:absolute;top:50%;width:34px;border-top:2px dashed rgba(255,255,255,.35)}.pc.l::after{left:100%}.pc.r::before{right:100%}
.pc span{text-align:center;flex:1;min-width:0}.pc small{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.65;font-family:'Trebuchet MS',Verdana,sans-serif}.pc b{font-weight:400;font-size:17px;display:block;white-space:nowrap}
.pc .ar{font:inherit;font-size:20px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;cursor:pointer;flex:none}.pc .ar:hover{background:#ffd23f;color:#2a1a05}
.pc.sc2{flex-direction:column;align-items:flex-start;gap:4px}.sw{display:flex;gap:4px;flex-wrap:wrap}.sw button{width:17px;height:17px;border-radius:50%;border:2px solid rgba(255,255,255,.35);cursor:pointer;padding:0;transition:transform .15s}.sw button:hover{transform:scale(1.25)}.sw button.on{border-color:#fff;transform:scale(1.2)}
@media(max-width:760px){.rig{height:auto;display:flex;flex-direction:column;align-items:center;gap:8px}.rig canvas{position:static;transform:none}.pc{position:static!important;width:min(320px,100%)}.pc::before,.pc::after{display:none}}
#vic{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#ffe066 0,#ff9f1c 35%,#c2185b 75%,#4a148c 100%);overflow:hidden;text-align:center;color:#fff}
.rays{position:absolute;inset:-60%;background:repeating-conic-gradient(rgba(255,255,255,.2) 0 9deg,transparent 9deg 18deg);animation:spin 22s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#conf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;cursor:default}
.vbox{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px}#vic:not(.hide) .vbox{animation:vin .9s cubic-bezier(.2,1.5,.4,1)}@keyframes vin{from{transform:scale(.2) rotate(-12deg);opacity:0}}
#vic canvas#vpv{position:static;width:200px;height:230px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.35));cursor:default}
#vt{margin:0;font-size:clamp(38px,10vw,108px);font-weight:400;line-height:1;-webkit-text-stroke:3px #5a1a00;text-shadow:0 6px 0 #5a1a00,0 0 36px rgba(255,255,255,.9)}
.vl{display:inline-block;animation:vjump 1.2s ease-in-out infinite;animation-delay:calc(var(--i)*.07s)}@keyframes vjump{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg) scale(1.12)}}
.vstats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.vstats span{background:rgba(0,0,0,.38);padding:8px 20px;border-radius:999px;font-size:22px}
#emw{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);display:none;gap:4px;background:rgba(20,16,46,.85);padding:6px 8px;border-radius:999px;z-index:10;border:2px solid rgba(255,255,255,.2);max-width:96vw;overflow-x:auto}#ov.hide~#vic.hide~#emw{display:flex}#emw.min{display:none!important}
#emw button{font:inherit;color:#fff;background:rgba(255,255,255,.1);border:0;border-radius:999px;width:38px;height:38px;font-size:22px;cursor:pointer;flex:none;padding:0;transition:transform .12s,background .12s}#emw button:hover{background:#ffd23f;transform:scale(1.12)}#emw i{width:2px;background:rgba(255,255,255,.25);margin:4px 3px;flex:none}
#chb{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:10;display:flex;flex-direction:column;gap:6px;align-items:center}
#chi{font:inherit;font-size:18px;width:min(420px,90vw);padding:10px 16px;border-radius:999px;border:3px solid #ffd23f;background:rgba(20,16,46,.92);color:#fff;outline:none}#emr{display:flex;gap:4px;background:rgba(20,16,46,.92);padding:6px 10px;border-radius:999px;flex-wrap:wrap;justify-content:center}#emr button{font-size:22px;background:none;border:0;cursor:pointer;padding:2px 4px}#emr button:hover{transform:scale(1.3)}
.bub{position:absolute;bottom:-80px;border-radius:50%;background:rgba(255,255,255,.07);animation:rise linear infinite}@keyframes rise{to{transform:translateY(-130vh)}}
.hide{display:none!important}
</style></head><body>
<canvas id="c"></canvas>
<div id="ov">
<section class="scr on" id="s-home">
<h1 id="t">Last Ones Standing</h1>
<p id="m">Drop in, loot up, outlast everyone.</p>
<button class="big" data-go="s-mode">PLAY</button>
<div class="tips"><span>WASD: move</span><span>Mouse: aim</span><span>Click: shoot</span><span>Right-click / Shift: aim down sights</span><span>E: swap weapon</span></div>
</section>
<section class="scr" id="s-mode"><button class="back" data-go="s-home">← Back</button>
<h2>Choose a mode</h2>
<div class="row">
<button class="card mc" data-m="br"><span class="ic">🪂</span><b>Battle Royale</b><span>Loot chests, outlast 11 bots as the storm closes in.</span></button>
<button class="card mc" data-m="ffa"><span class="ic">⚔️</span><b>Free For All</b><span>3 minutes, endless respawns. Most kills wins.</span></button>
<button class="card mc" data-m="practice"><span class="ic">🎯</span><b>Practice</b><span>Peaceful bots that never shoot. Test every weapon.</span></button>
</div>
<div class="row"><span class="pill">🤖 Bots</span><span class="pill off">🌐 Real people (needs an online server)</span></div>
</section>
<section class="scr" id="s-setup"><button class="back" data-go="s-mode">← Back</button>
<h2 id="sh">Setup</h2><p id="md"></p>
<div id="dg"><h3>Bot difficulty</h3><div class="row" id="diffs">
<button class="card opt sm" data-d="easy"><span class="ic">🙂</span><b>Easy</b><span>Sloppy shots</span><div class="pips"><u class="f"></u><u></u><u></u><u></u></div></button>
<button class="card opt sm on" data-d="medium"><span class="ic">😐</span><b>Medium</b><span>A fair fight</span><div class="pips"><u class="f"></u><u class="f"></u><u></u><u></u></div></button>
<button class="card opt sm" data-d="hard"><span class="ic">😠</span><b>Hard</b><span>Sharp and fast</span><div class="pips"><u class="f"></u><u class="f"></u><u class="f"></u><u></u></div></button>
<button class="card opt sm" data-d="nightmare"><span class="ic">💀</span><b>Nightmare</b><span>No mercy</span><div class="pips"><u class="f"></u><u class="f"></u><u class="f"></u><u class="f"></u></div></button>
</div></div>
<div id="wg"><h3>Your weapon</h3><div class="row" id="wps">
<button class="card opt sm" data-w="pistol"><span class="ic">🔫</span><b>Pistol</b><span>Steady</span></button>
<button class="card opt sm" data-w="smg"><span class="ic">⚡</span><b>SMG</b><span>Rapid fire</span></button>
<button class="card opt sm" data-w="shotgun"><span class="ic">💥</span><b>Shotgun</b><span>Close range</span></button>
<button class="card opt sm on" data-w="rifle"><span class="ic">🔥</span><b>Rifle</b><span>All-rounder</span></button>
<button class="card opt sm" data-w="sniper"><span class="ic">🔭</span><b>Sniper</b><span>One big hit</span></button>
<button class="card opt sm" data-w="rocket"><span class="ic">🚀</span><b>Missile</b><span>Huge blast</span></button>
<button class="card opt sm" data-w="grenade"><span class="ic">💣</span><b>Grenades</b><span>Lobbed blasts</span></button>
<button class="card opt sm" data-w="minigun"><span class="ic">🌀</span><b>Minigun</b><span>Slow but deadly</span></button>
<button class="card opt sm" data-w="knife"><span class="ic">🔪</span><b>Knife</b><span>One tap, tiny range</span></button>
<button class="card opt sm" data-w="sword"><span class="ic">🗡️</span><b>Sword</b><span>Wide heavy swing</span></button>
<button class="card opt sm" data-w="katana"><span class="ic">🌸</span><b>Katana</b><span>Sharp and quick</span></button>
</div></div>
<button class="big" data-go="s-char">NEXT</button>
</section>
<section class="scr" id="s-char"><button class="back" data-go="s-setup">← Back</button>
<h2>Make it yours</h2>
<div class="skin" id="skin"></div>
<h3>Then pick a fighter to start</h3>
<div class="row" id="chs">
<button class="card ch" data-k="scout"><i class="blob" style="--c:#4cc9f0"></i><b>Scout</b><span>75 HP · very fast</span></button>
<button class="card ch" data-k="soldier"><i class="blob" style="--c:#f9c74f"></i><b>Soldier</b><span>100 HP · 25 shield</span></button>
<button class="card ch" data-k="tank"><i class="blob" style="--c:#f94144"></i><b>Tank</b><span>160 HP · slow</span></button>
</div></section>
</div>
<div id="vic" class="hide"><div class="rays"></div><canvas id="conf"></canvas><div class="vbox"><canvas id="vpv" width="200" height="230"></canvas><h1 id="vt"></h1><div class="vstats" id="vs"></div><div class="row"><button class="big" id="vagain">PLAY AGAIN</button><button class="rnd" id="vmenu">Menu</button></div></div></div>
<div id="emw"></div>
<div id="chb" class="hide"><div id="emr"></div><input id="chi" maxlength="60" placeholder="Say something... (Enter to send)" autocomplete="off"></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);
const WS=4000,FONT="'Lilita One','Trebuchet MS',sans-serif";
const CH={scout:{hp:75,sh:0,spd:290,col:'#4cc9f0'},soldier:{hp:100,sh:25,spd:240,col:'#f9c74f'},tank:{hp:160,sh:0,spd:185,col:'#f94144'}};
const WP={
pistol:{n:'Pistol',dmg:16,rate:.32,speed:900,spread:.1,ads:0,pel:1,life:.8,col:'#ffe066'},
smg:{n:'SMG',dmg:8,rate:.08,speed:900,spread:.26,ads:.015,pel:1,life:.7,col:'#ff9f1c'},
shotgun:{n:'Shotgun',dmg:9,rate:.85,speed:750,spread:.5,ads:.12,pel:7,life:.4,col:'#ff595e'},
rifle:{n:'Rifle',dmg:20,rate:.14,speed:1300,spread:.2,ads:0,pel:1,life:.85,col:'#4cc9f0'},
sniper:{n:'Sniper',dmg:65,rate:1.4,speed:2200,spread:.14,ads:0,pel:1,life:1,col:'#8ac926'},
rocket:{n:'Missile Launcher',dmg:110,exp:150,rate:1.8,speed:650,spread:.02,ads:0,pel:1,life:1.2,col:'#ff4d4d'},
grenade:{n:'Grenade Launcher',dmg:55,exp:110,lob:1,rate:.85,speed:520,spread:.02,ads:0,pel:1,life:1,col:'#7bd34a'},
minigun:{n:'Minigun',dmg:8,rate:.04,speed:1100,spread:.3,ads:.05,pel:1,life:.75,slow:.4,col:'#cfd8dc'},
knife:{n:'Knife',melee:{range:34,arc:2.4,dmg:999},rate:.45,speed:1,life:1,spread:0,ads:0,pel:1,col:'#cfd8dc'},
sword:{n:'Sword',melee:{range:62,arc:2.6,dmg:70},rate:.75,speed:1,life:1,spread:0,ads:0,pel:1,col:'#ffd166'},
katana:{n:'Katana',melee:{range:78,arc:2,dmg:90},rate:.45,speed:1,life:1,spread:0,ads:0,pel:1,col:'#c9b6ff'}};
const TS={range:115,arc:6.3,dmg:140};
const WK=Object.keys(WP),NAMES=['Rex','Nova','Bolt','Mako','Zed','Pixel','Jinx','Echo','Blip','Rocky','Sunny'],RC=['#aab4c0','#52d35f','#3a86ff','#b45cff','#ffb703'],RN=['Common','Uncommon','Rare','Epic','Legendary'],RM=[1,1.12,1.25,1.4,1.55];
const DF={easy:{err:1,dm:.25,th:1.8,aim:.1,sp:.65,see:450,rng:350,bf:.7,bp:2,rt:1.3,hd:150},medium:{err:.8,dm:.4,th:1.5,aim:.2,sp:.75,see:520,rng:450,bf:.9,bp:1.4,rt:.9,hd:100},hard:{err:.4,dm:.65,th:1.1,aim:.45,sp:.9,see:650,rng:600,bf:1.3,bp:.8,rt:.5,hd:60},nightmare:{err:.15,dm:.95,th:.6,aim:.8,sp:1.05,see:900,rng:700,bf:3,bp:.2,rt:.2,hd:30}};
const MD={br:'Chests, loot and a shrinking storm. Last one alive wins.',ffa:'3 minutes, you respawn when you die. Most kills wins. Choose your weapon here, or press 1 to 5 in game.',practice:'Bots roam around but never shoot. You respawn forever. Press 1 to 5 to try weapons, Esc to leave.'};
const MN={br:'Battle Royale',ffa:'Free For All',practice:'Practice'};
function go(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id))}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
function pick(s,fn){document.querySelectorAll(s+' .opt').forEach(b=>b.onclick=()=>{document.querySelectorAll(s+' .opt').forEach(x=>x.classList.remove('on'));b.classList.add('on');fn(b.dataset)})}
pick('#diffs',d=>DN=d.d);pick('#wps',d=>WSEL=d.w);
document.querySelectorAll('.mc').forEach(b=>b.onclick=()=>{MODE=b.dataset.m;document.getElementById('dg').classList.toggle('hide',MODE==='practice');document.getElementById('wg').classList.toggle('hide',MODE==='br');
document.getElementById('sh').textContent=MN[MODE]+' setup';document.getElementById('md').textContent=MD[MODE];go('s-setup')});
for(let i=0;i<14;i++){const s=document.createElement('span'),r=(a,b)=>a+Math.random()*(b-a),z=r(30,110);s.className='bub';s.style.cssText='left:'+r(0,100)+'%;width:'+z+'px;height:'+z+'px;animation-duration:'+r(9,20)+'s;animation-delay:-'+r(0,15)+'s';ov.prepend(s)}
let state='menu',FX=[],chat=[],MODE='br',DN='medium',WSEL='rifle',D,FT=180,U,B,PK,OB,CS,P,t,feed,keys={},mouse={x:0,y:0,down:false},cam={x:0,y:0},last=0;
const R=(a,b)=>a+Math.random()*(b-a);
